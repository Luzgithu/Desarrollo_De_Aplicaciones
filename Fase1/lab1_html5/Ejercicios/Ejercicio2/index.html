<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 : Formulario de Registro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        form {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input:focus {
            border-color: #007bff;
            outline: none;
        }

        input:invalid:not(:placeholder-shown) {
            border-color: #dc3545;
        }

        input:valid:not(:placeholder-shown) {
            border-color: #28a745;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .ayuda {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

    <form action="#" method="post">

        <h2>Crear una cuenta</h2>

        <!-- Nombre -->
        <label for="nombre">Nombre completo:</label>
        <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Ej. Juan Pérez"
            required
            minlength="3"
            maxlength="50"
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]+"
            title="Ingresa entre 3 y 50 caracteres. Solo se permiten letras y espacios."
        >
        <span class="ayuda">Entre 3 y 50 caracteres.</span>

        <!-- Usuario -->
        <label for="usuario">Nombre de usuario:</label>
        <input
            type="text"
            id="usuario"
            name="usuario"
            placeholder="Ej. juan123"
            required
            minlength="4"
            maxlength="20"
            pattern="[A-Za-z0-9_]+"
            title="El usuario debe tener entre 4 y 20 caracteres. Solo letras, números y guion bajo."
        >

        <!-- Correo -->
        <label for="email">Correo electrónico:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="ejemplo@correo.com"
            required
            maxlength="100"
            title="Ingresa una dirección de correo electrónico válida."
        >

        <!-- Contraseña -->
        <label for="password">Contraseña:</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingresa tu contraseña"
            required
            minlength="8"
            maxlength="30"
            pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{8,30}"
            title="La contraseña debe tener entre 8 y 30 caracteres, una mayúscula, una minúscula y un número."
        >
        <span class="ayuda">
            Mínimo 8 caracteres, una mayúscula, una minúscula y un número.
        </span>

        <!-- Confirmación -->
        <label for="confirmar">Confirmar contraseña:</label>
        <input
            type="password"
            id="confirmar"
            name="confirmar"
            placeholder="Repite tu contraseña"
            required
            minlength="8"
            maxlength="30"
            title="Debes confirmar tu contraseña."
        >

        <!-- Edad -->
        <label for="edad">Edad:</label>
        <input
            type="number"
            id="edad"
            name="edad"
            min="18"
            max="90"
            placeholder="Ej. 18"
            required
            title="Debes tener entre 18 y 90 años."
        >

        <!-- Teléfono -->
        <label for="telefono">Teléfono:</label>
        <input
            type="tel"
            id="telefono"
            name="telefono"
            placeholder="987654321"
            required
            pattern="[0-9]{9}"
            title="Ingresa un número de teléfono de 9 dígitos."
        >

        <!-- Fecha de nacimiento -->
        <label for="fecha">Fecha de nacimiento:</label>
        <input
            type="date"
            id="fecha"
            name="fecha"
            placeholder="1-1-1946"
            required
            title="Selecciona tu fecha de nacimiento."
        >

        <button type="submit">Registrarse</button>

    </form>

</body>
</html>
